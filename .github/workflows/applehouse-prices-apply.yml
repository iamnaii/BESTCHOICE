name: ราคากลางรับซื้อ AppleHouse — นำเข้าระบบจริง

# นำราคาจาก apps/api/prisma/data/applehouse-valuations.json เข้าตาราง trade_in_valuations บน prod
# ด้วย apps/api/prisma/seed-sell-valuations-applehouse.ts (Cloud Run Job แบบเดียวกับ backfill-receipts.yml)
#
# - อัตโนมัติ: push เข้า main ที่แก้ไฟล์ราคา (= เจ้าของ merge PR จาก applehouse-prices-refresh.yml)
#   → รอ "Deploy to GCP" ของ commit นั้นจบ → สำเร็จ = นำเข้าด้วย image ของ commit นั้น
#   (เดิมใช้ workflow_run — ไม่ fire เลยทั้งสองรอบ deploy 20/11/69 จึงเปลี่ยนเป็น push + รอเอง)
# - กดเอง: ค่าเริ่มต้น = ดูอย่างเดียว (preview ไม่เขียน) · ติ๊ก apply = บันทึกจริง (ใช้ image ของ main ล่าสุด)
#
# ตัวนำเข้าคงราคาที่ร้านปรับเอง · เปิดรับซื้อกลับรุ่นที่ตัวเองเคยปิด · ปิดรุ่นที่ AppleHouse ไม่มีราคาแล้ว
# (กติกาใน apps/api/prisma/applehouse-import-plan.ts) · รันซ้ำด้วยไฟล์เดิม = ได้ผลเดิม

on:
  push:
    branches: [main]
    paths:
      - apps/api/prisma/data/applehouse-valuations.json
  workflow_dispatch:
    inputs:
      apply:
        description: 'บันทึกราคาลงระบบจริง? ไม่ติ๊ก = ดูอย่างเดียวว่าจะเปลี่ยนอะไร'
        type: boolean
        default: false

concurrency:
  group: applehouse-prices-apply
  cancel-in-progress: false

env:
  API_IMAGE: asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/bestchoice/api
  SNAPSHOT: apps/api/prisma/data/applehouse-valuations.json
  JOB: bestchoice-applehouse-prices

jobs:
  apply:
    name: นำราคาเข้าระบบจริง
    runs-on: ubuntu-24.04
    # deploy ใช้ ~20–30 นาที และอาจรอคิว deploy ก่อนหน้า (concurrency ของ deploy-gcp.yml)
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: เลือก commit
        id: target
        env:
          EVENT: ${{ github.event_name }}
          WANT_APPLY: ${{ inputs.apply }}
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::รันจาก main เท่านั้น"; exit 1
          fi
          if [ "$EVENT" = "push" ] || [ "$WANT_APPLY" = "true" ]; then mode=apply; else mode=preview; fi
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: รอ deploy ของ commit นี้จบ
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # deploy-gcp.yml run ของ push เดียวกัน — โผล่ช้ากว่า event นี้ได้ไม่กี่วินาที
          for i in $(seq 1 110); do
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy-gcp.yml --commit "$SHA" --event push \
              --limit 1 --json databaseId,status,conclusion --jq '.[0] // empty')
            if [ -n "$run" ]; then
              status=$(echo "$run" | jq -r .status)
              if [ "$status" = "completed" ]; then
                conclusion=$(echo "$run" | jq -r .conclusion)
                if [ "$conclusion" = "success" ]; then echo "deploy สำเร็จ"; exit 0; fi
                echo "::error::deploy ของ commit นี้ไม่สำเร็จ ($conclusion) — ราคายังไม่เข้า · แก้ deploy แล้วกด Run workflow นี้เองแบบติ๊ก apply"
                exit 1
              fi
            fi
            sleep 60
          done
          echo "::error::รอ deploy เกิน 110 นาที — กด Run workflow นี้เองแบบติ๊ก apply หลัง deploy เสร็จ"
          exit 1

      - name: Authenticate to GCP
        if: steps.target.outputs.changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        if: steps.target.outputs.changed == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: สร้างหรืออัปเดต Cloud Run Job
        if: steps.target.outputs.changed == 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          image="$API_IMAGE:$SHA"
          if ! gcloud artifacts docker images describe "$image" >/dev/null 2>&1; then
            echo "::error::ไม่พบ image $image (deploy ของ commit นี้ยังไม่ผ่าน) — รอ deploy เสร็จแล้วกดรัน workflow นี้เอง"
            exit 1
          fi
          args="tsx,apps/api/prisma/seed-sell-valuations-applehouse.ts"
          if [ "$MODE" = "apply" ]; then args="$args,--apply"; fi
          ARGS=(
            --project="${{ secrets.GCP_PROJECT_ID }}"
            --region="${{ secrets.GCP_REGION || 'asia-southeast1' }}"
            --image="$image"
            --set-secrets=DATABASE_URL=DATABASE_URL:latest
            --set-cloudsql-instances="${{ secrets.CLOUD_SQL_CONNECTION_NAME }}"
            --command=npx
            --args="$args"
            --max-retries=0
            --task-timeout=300s
          )
          gcloud run jobs update "$JOB" "${ARGS[@]}" 2>/dev/null \
            || gcloud run jobs create "$JOB" "${ARGS[@]}"

      - name: รันนำเข้า (${{ steps.target.outputs.mode }})
        if: steps.target.outputs.changed == 'true'
        env:
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          region="${{ secrets.GCP_REGION || 'asia-southeast1' }}"
          project="${{ secrets.GCP_PROJECT_ID }}"
          status=0
          execution=$(gcloud run jobs execute "$JOB" --project="$project" --region="$region" --wait \
            --format='value(metadata.name)') || status=$?
          {
            if [ "$MODE" = "apply" ]; then echo "## นำราคาเข้าระบบจริงแล้ว"; else echo "## ดูอย่างเดียว (ยังไม่บันทึก)"; fi
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$execution" ]; then
            sleep 20  # log ของ Cloud Run เข้า Logging ช้ากว่าตัวงานเล็กน้อย
            gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND labels.\"run.googleapis.com/execution_name\"=\"$execution\"" \
              --project="$project" --order=asc --limit=300 --format='value(textPayload)' \
              >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(อ่าน log ไม่ได้ — ดูใน Cloud Run Job $execution)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
