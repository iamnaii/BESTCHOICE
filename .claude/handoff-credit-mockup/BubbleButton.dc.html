<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #F9F8F6; font-family: 'Inter', 'IBM Plex Sans Thai', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #0D9668; } a:hover { color: #0A7A55; }
    .ic { display: block; }
  </style>
</helmet>

<div style="width: 460px; box-sizing: border-box; padding: 20px; background: #F9F8F6; color: #231E1A; display: flex; flex-direction: column; gap: 22px;">

  <div>
    <div style="font-size: 11px; font-weight: 700; color: #746A63; letter-spacing: 0.03em; margin-bottom: 8px;">ปกติ — จอสัมผัสเห็นตลอด จอคอมโผล่ตอนชี้เมาส์</div>
    <div style="display: flex; align-items: flex-start; gap: 6px;">
      <div style="width: 200px; border-radius: 14px 14px 14px 4px; overflow: hidden; border: 1px solid #E4E1DD; background: #EFEEEB; height: 128px; display: grid; place-items: center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#746A63" opacity="0.5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="ic"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      </div>
      <div style="display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; border: 1px solid #E4E1DD; background: #FDFDFC; color: #746A63; box-shadow: 0 1px 2px rgba(0,0,0,0.04);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ic"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
    </div>
    <div style="margin-top: 8px; display: inline-block; border-radius: 6px; background: #231E1A; color: #FDFDFC; padding: 5px 9px; font-size: 11px; max-width: 300px; line-height: 1.45;">แนบเป็นสเตทเม้นให้ AI ตรวจเครดิต</div>
  </div>

  <div>
    <div style="font-size: 11px; font-weight: 700; color: #746A63; letter-spacing: 0.03em; margin-bottom: 8px;">แนบแล้ว — ค้างไว้ให้รู้ว่าใบไหนแนบไปแล้ว</div>
    <div style="display: flex; align-items: flex-start; gap: 6px;">
      <div style="width: 200px; border-radius: 14px 14px 14px 4px; overflow: hidden; border: 1px solid #E4E1DD; background: #EFEEEB; height: 128px; display: grid; place-items: center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#746A63" opacity="0.5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="ic"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      </div>
      <div style="display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; border: 1px solid #0D9668; background: #0D9668; color: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.04);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="ic"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
    </div>
    <div style="margin-top: 8px; display: inline-block; border-radius: 6px; background: #231E1A; color: #FDFDFC; padding: 5px 9px; font-size: 11px; max-width: 300px; line-height: 1.45;">แนบแล้ว — กดอีกครั้งเพื่อเอาออก</div>
  </div>

  <div>
    <div style="font-size: 11px; font-weight: 700; color: #746A63; letter-spacing: 0.03em; margin-bottom: 8px;">รูปหมดอายุ — ปุ่มยังอยู่แต่กดไม่ได้ พร้อมบอกเหตุผล</div>
    <div style="display: flex; align-items: flex-start; gap: 6px;">
      <div style="width: 200px; border-radius: 14px 14px 14px 4px; border: 1px dashed #E4E1DD; background: #F7F7F5; height: 128px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; padding: 12px; text-align: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#746A63" opacity="0.5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="ic"><path d="M10.41 10.41a2 2 0 1 1-2.83-2.83"/><path d="m13.5 13.5 6 6"/><path d="M3 3l18 18"/><path d="M21 15V5a2 2 0 0 0-2-2H9"/><path d="M3 7v12a2 2 0 0 0 2 2h12"/></svg>
        <span style="font-size: 11px; color: #746A63; line-height: 1.4;">รูปนี้โหลดไม่ขึ้นแล้ว</span>
      </div>
      <div style="display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; border: 1px solid #E4E1DD; background: #FDFDFC; color: #746A63; opacity: 0.4;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ic"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
    </div>
    <div style="margin-top: 8px; display: inline-block; border-radius: 6px; background: #231E1A; color: #FDFDFC; padding: 5px 9px; font-size: 11px; max-width: 300px; line-height: 1.45;">รูปนี้หมดอายุจาก Facebook แล้ว — แนบไม่ได้ ขอลูกค้าส่งใหม่</div>
  </div>

</div>
</x-dc>
</body>
</html>
