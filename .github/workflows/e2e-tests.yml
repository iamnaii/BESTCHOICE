name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # 30 -> 60 (2026-08-25): งบ 30 นาทีเดิม "ไม่เคยถูกทดสอบ" เพราะ job ตายที่ boot
    # ตั้งแต่นาทีที่ 5 มาตลอด (seed ล้าง account_role_map — แก้ใน PR #1483) พอเทส
    # ได้รันจริงครั้งแรก shard 1 ทำได้ 24m43s แล้วโดน cancel ที่ 30m15s ยังไม่จบ
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      fail-fast: false
      matrix:
        # 2 -> 4 shards (2026-08-25). คอมเมนต์เดิมบอกว่า setup คือต้นทุนหลักและ
        # "เวลารวมยาวขึ้นเล็กน้อยเท่านั้น" — ข้อสรุปนั้นตั้งอยู่บนข้อมูลที่ผิด เพราะตอนนั้น
        # เทสไม่เคยได้รันเลย (API บูตไม่ขึ้น ตายที่นาทีที่ 5 ทุกครั้ง) พอรันจริงพบว่า
        # setup ~5.5 นาที แต่การรันเทสกินเกิน 24 นาทีต่อ shard และยังไม่จบ
        # ⇒ ต้นทุนหลักคือ "รันเทส" ไม่ใช่ setup
        #
        # เลือกเพิ่ม shard แทนการเพิ่ม `workers` ของ Playwright (ยังคง workers: 1)
        # เพราะทุกเทสใช้ API + Postgres ตัวเดียวกันต่อ runner — รันขนานในเครื่องเดียว
        # เสี่ยงกวนสถานะกันเอง ส่วนการเพิ่ม shard ได้ DB คนละชุดต่อ runner
        shard: [1, 2, 3, 4]

    env:
      # เพดาน heap ระดับ job — ขั้น "Build API" ตาย OOM ทั้ง 4 shard (2026-08-26)
      # เป็นอาการเดียวกับที่ #1488/#1489 แก้ให้ deploy-gcp.yml เมื่อ 2026-08-25
      # แต่ตกหล่น workflow นี้ · ตั้งที่ระดับ job ตามเหตุผลเดิม: เป็นเพดานร่วมของ
      # ทุกงาน node ที่นี่ ไล่แก้ทีละขั้นคือรอให้ขั้นถัดไปตายแล้วค่อยตามแก้ทีหลัง
      NODE_OPTIONS: --max-old-space-size=6144
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db?schema=public
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      ENCRYPTION_KEY: test-encryption-key-for-ci
      # PII สองตัวนี้ **จำเป็น** ไม่ใช่ของเสริม — `CustomerPiiService.encryptForWrite`
      # โยน error ทิ้งทันทีเมื่อจะเขียน nationalId/phone แล้วคีย์หาย หรือสั้นกว่า 32
      # ตัวอักษร (customer-pii.service.ts:171-182 "refusing to write plaintext") ⇒
      # ก่อนหน้านี้ทุกเทสที่สร้างลูกค้าผ่าน API ได้ HTTP 500 INTERNAL_ERROR
      # หมายเหตุ: seed ใช้ `prisma.customer.create` ตรง จึงไม่โดนด่านนี้ —
      # ข้อมูลตั้งต้นมีครบมาตลอด ที่พังคือเฉพาะการสร้างใหม่ระหว่างเทส
      # ค่าปลอมสำหรับ CI เท่านั้น (Postgres ใน container ที่ถูกทิ้งหลังรันจบ)
      #
      # ⚠️ PII_ENCRYPTION_KEY ต้องเป็น **hex 64 ตัวอักษร** ไม่ใช่แค่ "ยาวเกิน 32"
      # crypto.util.ts:62 ทำ `createCipheriv(ALGO, Buffer.from(key, 'hex'), iv)` ⇒
      # สตริงธรรมดาจะถูกแปลงเหลือไม่กี่ไบต์แล้วโยน "Invalid key length" → HTTP 500
      # (ด่านที่บรรทัด 55 ตรวจแค่ความยาว ≥32 จึงปล่อยค่าที่ใช้ไม่ได้ผ่านมาถึงตรงนี้)
      # 64 ตัวอักษร hex = 32 ไบต์ ตามที่ aes-256-gcm ต้องการ
      PII_ENCRYPTION_KEY: e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0e2e0
      # ส่วนตัวนี้เป็น HMAC key (pii.util.ts:53) รับสตริงอะไรก็ได้ ขอแค่ยาว >= 32
      PII_HASH_SALT: e2e-pii-hash-salt-32-chars-minimum-ci
      PORT: 3000
      NODE_ENV: test
      BASE_URL: http://localhost:5173
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Run DB migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Seed test database
        run: node apps/api/dist/prisma/seed.js

      - name: Build Web
        run: npm run build --workspace=apps/web
        env:
          VITE_API_URL: http://localhost:3000/api

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Start API server
        run: node apps/api/dist/src/main.js &

      - name: Wait for API
        run: npx wait-on http://localhost:3000/api/health --timeout 30000

      - name: Serve Web build
        run: npx serve -s apps/web/dist -l 5173 &

      - name: Wait for Web
        run: npx wait-on http://localhost:5173 --timeout 15000

      - name: Run E2E tests (shard ${{ matrix.shard }}/2)
        # ตัวหารมาจาก `strategy.job-total` (จำนวน job ที่ matrix สร้างจริง) ไม่ใช่เลขที่พิมพ์มือ
        # — ตอนเพิ่ม matrix 2->4 รอบแรกลืมแก้เลข 2 ตรงนี้ ทำให้ shard 3 กลายเป็น
        # `--shard=3/2` ซึ่งไม่ถูกต้อง shard 3 กับ 4 จึงตายทันที ผูกกับ matrix แล้วจะไม่หลุดอีก
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        working-directory: apps/web

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots-shard-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 3

  # Merge shard reports into a single report
  merge-reports:
    name: Merge E2E Reports
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-shard-*
          path: all-reports/

      - name: Merge reports
        run: npx playwright merge-reports --reporter=html all-reports/
        working-directory: apps/web
        continue-on-error: true

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: apps/web/playwright-report/
          retention-days: 14
