name: Deploy to GCP (Cloud Run + Firebase)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'workflows/**'
      - 'scripts/ops/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'workflows/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'ทางลัดฉุกเฉิน — ข้ามด่านเทส (ใช้เฉพาะแก้บั๊กด่วน/งานที่ไม่แตะโค้ดหลังบ้าน)'
        type: boolean
        default: false

env:
  NODE_VERSION: '20'
  GAR_LOCATION: asia-southeast1
  API_IMAGE: asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/bestchoice/api

# Serialise runs per ref so rapid pushes to main can't overlap a migrate/deploy.
# cancel-in-progress:false → queue, never abort a run mid-migration/deploy.
concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================
  # ด่านเทส — แตกเป็น 4 job รันคู่ขนาน (2026-09-05, คำสั่งเจ้าของ "deploy ให้เร็วกว่านี้")
  #
  # เดิม job เดียว `lint-and-test` รัน 13 ขั้นต่อกันเป็นเส้นตรง ~21 นาที (install 2.5 · Test API 5.2 ·
  # Test Web 4.3 · integration 3.2 · lint 2 · build 2.5 …) ทั้งที่ lint / test web / test API /
  # integration ไม่พึ่งกันเลย ตอนนี้เส้นทางที่ยาวสุดคือ test-api (~8 นาที) ด่านยังครบเท่าเดิมทุกตัว —
  # migrate-db / deploy-api / deploy-web ต้องเห็นว่า "ไม่มี gate ไหน failure/cancelled" ผ่าน
  # `needs.*.result` ก่อนเดินต่อ (ดู if: ของแต่ละ job ปลายทาง)
  #
  # ทางลัดฉุกเฉิน skip_tests (คำสั่งเจ้าของ 2026-08-24): ข้าม 4 gate นี้ (result = skipped) แต่
  # build-web ยังรันเสมอ เพราะเป็นตัวผลิต artifact ที่ deploy-web ใช้ — ข้ามเทสได้ ข้าม build ไม่ได้
  #
  # การติดตั้ง deps ทุก job ผ่าน composite action เดียว (.github/actions/setup-deps) ซึ่ง cache
  # node_modules ทั้ง workspace ตาม package-lock ⇒ install ~2.5 นาที → ไม่กี่วินาทีเมื่อ cache hit
  #
  # heap: งาน node ใน repo นี้ข้ามเพดาน default (~2GB) แล้ว — exit 134 ทั้ง Lint API (eslint
  # type-aware ~2,000 ไฟล์) และ Test API (jest --runInBand สะสมทุก suite ในโปรเซสเดียว) บน c3d27d87
  # จึงตั้ง NODE_OPTIONS ระดับ job ให้ทุก job ที่รัน node (runner มี RAM 16GB)
  # ============================================
  lint:
    name: Lint + Build API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.skip_tests != true
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          prisma: both

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
        # ขั้นนี้ continue-on-error อยู่แล้ว = ไม่เคยกั้นอะไร แต่เคยกิน 7 นาทีจากงบ 25 นาที
        # จน job ชน timeout แล้ว deploy ไม่ออก (run 33840369707) — จำกัดไว้ไม่ให้กินงบคนอื่น
        timeout-minutes: 3

      - name: Lint API
        run: npm run lint --workspace=apps/api

      - name: Lint Web
        run: npm run lint --workspace=apps/web

      # gate ว่า API คอมไพล์ผ่าน + verify:assets — บน PR นี่คือด่านเดียวของ API build
      # (build-and-push-api / Docker รันเฉพาะ main)
      - name: Build API
        run: npm run build --workspace=apps/api

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.skip_tests != true
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          # shared types ที่ web import ต้องมี Prisma client (SHOP) — เหมือนที่ deploy-web เดิม generate ก่อน build
          prisma: shop

      # 2026-08-06 (payroll round 2-3) — web unit tests never ran in ANY
      # pipeline before this step (both payroll web tests were dead in CI).
      - name: Test Web
        run: npm run test --workspace=apps/web

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: inputs.skip_tests != true
    env:
      NODE_OPTIONS: --max-old-space-size=6144

    # jest unit specs บางไฟล์ต่อ DB จริง (asset-journal, credit-check, room-manager …) จึงต้องมี
    # Postgres ทั้งสองตัว + migrate เหมือนเดิม (ซ้ำกับ test-integration โดยจำเป็น — GitHub Actions
    # ไม่มี YAML anchor ให้แชร์ services block)
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      # SP7.1 — second postgres for FINANCE DB (dual-Prisma architecture)
      postgres-finance:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_finance_db
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          prisma: both

      - name: Run DB migrations (SHOP)
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db?schema=public

      - name: Run DB migrations (FINANCE)
        run: npm run prisma:finance:migrate:deploy --workspace=apps/api
        env:
          DATABASE_URL_FINANCE: postgresql://test:test@localhost:5433/test_finance_db?schema=public
      - name: Test API
        run: npm run test --workspace=apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db?schema=public
          DATABASE_URL_FINANCE: postgresql://test:test@localhost:5433/test_finance_db?schema=public
          JWT_SECRET: test-secret

  test-integration:
    name: Integration (dual-Prisma + money invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.skip_tests != true
    env:
      NODE_OPTIONS: --max-old-space-size=6144

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      # SP7.1 — second postgres for FINANCE DB (dual-Prisma architecture)
      postgres-finance:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_finance_db
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          prisma: both

      - name: Run DB migrations (SHOP)
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db?schema=public

      - name: Run DB migrations (FINANCE)
        run: npm run prisma:finance:migrate:deploy --workspace=apps/api
        env:
          DATABASE_URL_FINANCE: postgresql://test:test@localhost:5433/test_finance_db?schema=public
      - name: Run dual-Prisma integration tests (SP7.1)
        run: npm run test:e2e --workspace=apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db?schema=public
          DATABASE_URL_FINANCE: postgresql://test:test@localhost:5433/test_finance_db?schema=public
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          JWT_EXPIRATION: 15m
          JWT_REFRESH_EXPIRATION: 7d
          NODE_ENV: test

      # DB-backed money-invariant specs (vitest) — jest ignores these via
      # testPathIgnorePatterns (/cpa-templates/, installments/reschedule.service.spec.ts)
      # and test:e2e only matches e2e/*.e2e-spec.ts, so before this step they NEVER
      # ran in any pipeline (#1328). BLOCKING since 2026-07-03: the two stale goldens
      # the first runs caught were fixed (#1331, #1333) and the suite is green.
      # contract-cancellation.template.spec.ts is excluded: it is a jest-format
      # mocked unit spec (uses jest.* globals) that crashes vitest's collector.
      # src/modules/accounting/*.integration.spec.ts (bad-debt streak specs) added
      # Task 7 — jest ignores them too (same .integration.spec.ts naming as above),
      # so they NEVER ran in CI either until now.
      # src/modules/contract-exchange/__tests__/*.integration.spec.ts (Device Swap
      # priced-flow E2E) added 2026-07-29 — same jest-invisible naming; without an
      # explicit glob here it would never run in any pipeline.
      # src/modules/interco-settlement/__tests__/*.integration.spec.ts (Inter-co
      # settlement batch approve/reverse E2E) added 2026-07-30 Task 4 — same
      # jest-invisible naming; fail-loud via `ls` (no `|| true`) so a missing/
      # renamed file breaks the build instead of silently vanishing from CI
      # (the exact orphan-spec failure mode this glob-per-suite convention
      # exists to prevent — see JP5_FILES/EXCH_FILES above).
      # CONTRACTS_FILES / JOURNAL_FILES / OVERDUE_FILES / PAYMENTS_FILES added
      # 2026-08-02 (orphan-spec sweep) — 8 more *.integration.spec.ts (+ two
      # plain-named journal specs) that matched NEITHER jest's ignore-carve-out
      # NOR any glob here, so they ran in NO pipeline at all. The remaining
      # jest-invisible orphans (eir.spec.ts, csv-fixture-loader.spec.ts,
      # contract-cancellation.template.spec.ts) were mocked/pure — those were
      # wired into jest instead by narrowing testPathIgnorePatterns (see
      # apps/api/package.json), not added here.
      - name: Run DB-backed money-invariant specs (vitest — #1328)
        timeout-minutes: 10
        working-directory: apps/api
        run: |
          FILES=$(ls src/modules/journal/cpa-templates/*.spec.ts | grep -v contract-cancellation.template.spec.ts)
          ACCT_FILES=$(ls src/modules/accounting/*.integration.spec.ts)
          JP5_FILES=$(ls src/modules/journal/cpa-templates/__tests__/*.spec.ts)
          EXCH_FILES=$(ls src/modules/contract-exchange/__tests__/*.integration.spec.ts)
          INTERCO_FILES=$(ls src/modules/interco-settlement/__tests__/*.integration.spec.ts)
          # + __tests__/ level added 2026-08-20 (Phase 3 contract-cancellation C-1)
          CONTRACTS_FILES=$(ls src/modules/contracts/*.integration.spec.ts src/modules/contracts/__tests__/*.integration.spec.ts)
          JOURNAL_FILES="src/modules/journal/__tests__/scenario-helpers.spec.ts src/modules/journal/cron/installment-accrual.cron.spec.ts"
          OVERDUE_FILES=$(ls src/modules/overdue/*.integration.spec.ts src/modules/overdue/services/*.integration.spec.ts)
          PAYMENTS_FILES=$(ls src/modules/payments/services/*.integration.spec.ts)
          # Payroll SHOP-side E2E (2026-08-06) — jest ignores *.integration.spec.ts
          EXPDOC_FILES=$(ls src/modules/expense-documents/__tests__/*.integration.spec.ts)
          # Cash-forecast SQL anti-drift (2026-08-09) — same jest-invisible naming
          DASH_FILES=$(ls src/modules/dashboard/__tests__/*.integration.spec.ts)
          # Equity module E2E (2026-08-10) — same jest-invisible *.integration.spec.ts naming
          EQUITY_FILES=$(ls src/modules/equity/__tests__/*.integration.spec.ts)
          # Void-sale E2E (2026-08-23) — same jest-invisible *.integration.spec.ts naming;
          # new directory ⇒ new glob (บทเรียน jp5-vat-split: glob ไม่ recurse เอง)
          SALES_FILES=$(ls src/modules/sales/__tests__/*.integration.spec.ts)
          # Stock go-live wipe (2026-09-05) — ตรรกะอยู่ใต้ src/cli/ ⇒ directory ใหม่ = glob ใหม่
          STOCK_GO_LIVE_FILES=$(ls src/cli/stock-go-live/__tests__/*.integration.spec.ts)
          # Device-return intake (2026-09-20) — each new directory needs an explicit glob.
          DEVRET_FILES=$(ls src/modules/device-returns/__tests__/*.integration.spec.ts)
          npx vitest run --no-file-parallelism $FILES \
            src/modules/installments/reschedule.service.spec.ts \
            $ACCT_FILES \
            $JP5_FILES \
            $EXCH_FILES \
            $INTERCO_FILES \
            $CONTRACTS_FILES \
            $JOURNAL_FILES \
            $OVERDUE_FILES \
            $PAYMENTS_FILES \
            $EXPDOC_FILES \
            $DASH_FILES \
            $EQUITY_FILES \
            $SALES_FILES \
            $STOCK_GO_LIVE_FILES \
            $DEVRET_FILES
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db?schema=public
          DATABASE_URL_FINANCE: postgresql://test:test@localhost:5433/test_finance_db?schema=public
          JWT_SECRET: test-secret
          NODE_ENV: test

  # ============================================
  # Build เว็บทั้งสองแอป "ครั้งเดียว" — เป็นทั้ง gate (PR) และตัวผลิต artifact ให้ deploy-web (main)
  #
  # เดิม lint-and-test build Web + Web-Shop แล้วทิ้ง จากนั้น deploy-web ติดตั้ง deps ใหม่ ลง Chromium
  # ใหม่ แล้ว build ซ้ำทั้งหมดอีกรอบ (5 นาทีครึ่ง) ตอนนี้ build ที่นี่ที่เดียวแล้วส่ง dist ต่อผ่าน artifact
  # ไม่ผูกกับ skip_tests — ข้ามด่านเทสได้ แต่ข้ามการ build ไม่ได้ (ไม่มีอะไรจะ deploy)
  # ============================================
  build-web:
    name: Build Web + Web-Shop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      # main (push/dispatch) = build ของจริงสำหรับ deploy · PR = build เปล่าเป็น gate (URL localhost เหมือนเดิม)
      IS_MAIN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          # shared types ที่ web import ต้องมี Prisma client (SHOP)
          prisma: shop

      - name: Build admin web (apps/web → hosting:admin)
        run: npm run build --workspace=apps/web
        env:
          VITE_API_URL: ${{ env.IS_MAIN == 'true' && 'https://api.bestchoicephone.app/api' || 'http://localhost:3000/api' }}
          # socket.io ต้องต่อ API โดยตรง — Firebase Hosting rewrite /api/** ไม่รองรับ WebSocket (inbox ขึ้น "ออฟไลน์" บน prod 2026-09-06)
          VITE_WS_URL: ${{ env.IS_MAIN == 'true' && 'https://api.bestchoicephone.app' || 'http://localhost:3000' }}
          VITE_SHOP_URL: https://www.bestchoicephone.com
          VITE_LIFF_ID: 2009442540-d9XnzWwl
          # Surface short commit SHA so the version badge can show it next
          # to the CalVer (e.g. "v26.5.1·a1b2c3d"). vite.config.ts trims to 7 chars.
          GIT_COMMIT: ${{ github.sha }}

      # prerender ต้องใช้ headless Chromium — เฉพาะ main (PR build เปล่าเร็วเหมือนเดิม)
      - name: Install Playwright Chromium (shop prerender)
        if: env.IS_MAIN == 'true'
        run: npx playwright install --with-deps chromium

      # build:prerender = build ปกติ + snapshot 11 หน้า marketing เป็น HTML จริงต่อ route
      # เพื่อให้ AI crawlers (ไม่รัน JS) กับ Bing เห็นเนื้อหา — ดู apps/web-shop/scripts/prerender.mjs
      - name: Build customer shop (apps/web-shop → hosting:shop, prerendered)
        if: env.IS_MAIN == 'true'
        run: npm run build:prerender --workspace=apps/web-shop

      # /sell rework ลบไฟล์จำนวนมากใน web-shop — ก่อนหน้านี้ CI ไม่เคย build
      # web-shop เลย (พังจะไปโผล่ตอน deploy บน main) จึงเพิ่ม gate ที่ PR
      - name: Build customer shop (PR gate, no prerender)
        if: env.IS_MAIN != 'true'
        run: npm run build --workspace=apps/web-shop

      # ส่ง dist ให้ deploy-web (เฉพาะ main — บน PR ไม่มีใครใช้) · เก็บ 3 วันพอสำหรับ debug
      - name: Upload web dist
        if: env.IS_MAIN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3
          if-no-files-found: error

      - name: Upload shop dist
        if: env.IS_MAIN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shop-dist
          path: apps/web-shop/dist
          retention-days: 3
          if-no-files-found: error

  # ============================================
  # สรุปผลทุก gate เป็น status check เดียวชื่อเดิม "Lint & Test" — branch protection ของ main
  # บังคับชื่อนี้ (required_status_checks) และ docs/CONTRIBUTING.md อ้างชื่อนี้ จึงห้ามเปลี่ยน/หาย
  # job นี้ไม่รันอะไรเอง: ผ่านเมื่อทุก gate success หรือ skipped (ทางลัดฉุกเฉิน), แดงเมื่อ gate ใด
  # failure/cancelled — migrate-db / deploy-web พึ่ง check นี้ตัวเดียวแทนการไล่เช็คทีละ gate
  # ============================================
  test-chat-credit:
    name: Chat credit + approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.skip_tests != true
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      CREDIT_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
        with:
          prisma: both
      - name: Install isolated PostgreSQL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgvector
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify credit flow on isolated PostgreSQL
        run: bash tools/test-chat-credit.sh

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test-web, test-api, test-integration, test-chat-credit, build-web]
    if: always()
    steps:
      - name: ผลรายด่าน
        run: |
          cat <<'EOF'
          lint:             ${{ needs.lint.result }}
          test-web:         ${{ needs.test-web.result }}
          test-api:         ${{ needs.test-api.result }}
          test-integration: ${{ needs.test-integration.result }}
          test-chat-credit: ${{ needs.test-chat-credit.result }}
          build-web:        ${{ needs.build-web.result }}
          EOF
      - name: มี gate แดง/ถูกยกเลิก
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error title=Lint & Test::มี gate ที่ failure/cancelled — ห้าม merge/deploy"
          exit 1
      - name: ทุก gate ผ่าน
        run: echo "ทุก gate ผ่าน (หรือถูกข้ามด้วย skip_tests)"

  # ============================================
  # Job 2: Build API Docker Image → Artifact Registry
  # ============================================
  build-and-push-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    # build ขนานกับเทส (image ที่ build แล้วไม่ถูกใช้ถ้าเทสแดง) — ด่านจริงอยู่ที่ migrate-db/deploy
    # ซึ่ง needs: lint-and-test ⇒ เทสไม่ผ่าน = ไม่มีอะไรขึ้น prod เหมือนเดิม แต่ประหยัด ~8 นาที
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image tag
        id: meta
        run: echo "tags=${{ env.API_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ============================================
  # Job 3: Run Prisma Migrations via Cloud Run Job
  # ============================================
  migrate-db:
    name: Run Database Migrations
    needs: [lint-and-test, build-and-push-api]
    # "Lint & Test" = job สรุปทุก gate (lint / test-web / test-api / test-integration / build-web):
    # success เมื่อทุก gate ผ่านหรือถูกข้ามด้วยทางลัดฉุกเฉิน, failure เมื่อ gate ใดแดง/ถูกยกเลิก
    # build-web อยู่ในสรุปด้วย: API กับ web ต้องขึ้นพร้อมกัน — ถ้า web build พัง ห้าม migrate/deploy API
    if: >-
      always() && needs.build-and-push-api.result == 'success' &&
      needs.lint-and-test.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Create or update migration job
        run: |
          gcloud run jobs update bestchoice-migrate \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=${{ secrets.GCP_REGION || 'asia-southeast1' }} \
            --image=${{ env.API_IMAGE }}:${{ github.sha }} \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest \
            --set-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --command="npx" \
            --args="prisma,migrate,deploy,--schema=./apps/api/prisma/schema.prisma" \
            --max-retries=3 \
            --task-timeout=300s \
            2>/dev/null || \
          gcloud run jobs create bestchoice-migrate \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=${{ secrets.GCP_REGION || 'asia-southeast1' }} \
            --image=${{ env.API_IMAGE }}:${{ github.sha }} \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest \
            --set-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --command="npx" \
            --args="prisma,migrate,deploy,--schema=./apps/api/prisma/schema.prisma" \
            --max-retries=3 \
            --task-timeout=300s

      - name: Execute migration
        run: |
          gcloud run jobs execute bestchoice-migrate \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=${{ secrets.GCP_REGION || 'asia-southeast1' }} \
            --wait

  # ============================================
  # Job 4: Deploy API to Cloud Run
  # ============================================
  deploy-api:
    name: Deploy API to Cloud Run
    # test-api อยู่ใน needs เพื่ออ่าน result (skipped = ทางลัดฉุกเฉิน) — ด่านจริงคือ migrate-db
    needs: [migrate-db, test-api]
    if: always() && needs.migrate-db.result == 'success'
    runs-on: ubuntu-latest

    steps:
      # ทางลัดฉุกเฉินถูกใช้ → ทิ้งร่องรอยไว้ในหน้า run + summary ให้ตามย้อนหลังได้ว่าใครกด เมื่อไร
      - name: ⚠️ บันทึกว่า deploy นี้ข้ามด่านเทส
        if: needs.test-api.result == 'skipped'
        run: |
          echo "::warning title=ข้ามด่านเทส::deploy นี้ใช้ทางลัดฉุกเฉิน (skip_tests) โดย ${{ github.actor }} — ต้องรันเทสตามให้ครบหลังจากนี้"
          {
            echo "## ⚠️ Deploy นี้ข้ามด่านเทส"
            echo ""
            echo "- ผู้กด: **${{ github.actor }}**"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- เหตุผลที่อนุญาต: ทางลัดฉุกเฉินตามคำสั่งเจ้าของ 2026-08-24"
            echo ""
            echo "**ต้องทำต่อ:** รัน Lint & Test ให้ผ่านบน main โดยเร็วที่สุด"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure GCS bucket exists
        run: |
          gcloud storage buckets describe gs://bestchoice-documents --project=${{ secrets.GCP_PROJECT_ID }} 2>/dev/null || \
          gcloud storage buckets create gs://bestchoice-documents \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --location=${{ secrets.GCP_REGION || 'asia-southeast1' }} \
            --uniform-bucket-level-access

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy bestchoice-api \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=${{ secrets.GCP_REGION || 'asia-southeast1' }} \
            --image=${{ env.API_IMAGE }}:${{ github.sha }} \
            --platform=managed \
            --port=3000 \
            --min-instances=1 \
            --max-instances=10 \
            --memory=2Gi \
            --cpu=2 \
            --cpu-boost \
            --timeout=3600 \
            --execution-environment=gen2 \
            --set-secrets="\
          JWT_SECRET=JWT_SECRET:latest,\
          JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,\
          ENCRYPTION_KEY=ENCRYPTION_KEY:latest,\
          DATABASE_URL=DATABASE_URL:latest,\
          ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,\
          S3_ACCESS_KEY=S3_ACCESS_KEY:latest,\
          S3_SECRET_KEY=S3_SECRET_KEY:latest,\
          LINE_CHANNEL_ACCESS_TOKEN=LINE_CHANNEL_ACCESS_TOKEN:latest,\
          LINE_CHANNEL_SECRET=LINE_CHANNEL_SECRET:latest,\
          SMS_API_KEY=SMS_API_KEY:latest,\
          SMS_API_SECRET=SMS_API_SECRET:latest,\
          SMTP_PASS=SMTP_PASS:latest,\
          PAYSOLUTIONS_SECRET_KEY=PAYSOLUTIONS_SECRET_KEY:latest,\
          PAYSOLUTIONS_API_KEY=PAYSOLUTIONS_API_KEY:latest,\
          LINE_FINANCE_CHANNEL_SECRET=LINE_FINANCE_CHANNEL_SECRET:latest,\
          LINE_FINANCE_CHANNEL_ACCESS_TOKEN=LINE_FINANCE_CHANNEL_ACCESS_TOKEN:latest,\
          LINE_LOGIN_CHANNEL_SECRET=LINE_LOGIN_CHANNEL_SECRET:latest,\
          FB_APP_SECRET=FB_APP_SECRET:latest,\
          FB_VERIFY_TOKEN=FB_VERIFY_TOKEN:latest,\
          FB_PAGE_ACCESS_TOKEN=FB_PAGE_ACCESS_TOKEN:latest,\
          FB_PAGE_ID=FB_PAGE_ID:latest,\
          PII_ENCRYPTION_KEY=pii-encryption-key:latest,\
          PII_HASH_SALT=pii-hash-salt:latest" \
            --set-env-vars="\
          TZ=Asia/Bangkok,\
          NODE_ENV=production,\
          LOG_FORMAT=json,\
          SMTP_HOST=smtp.resend.com,\
          SMTP_PORT=465,\
          SMTP_USER=resend,\
          SMTP_FROM=BESTCHOICE <noreply@bestchoicephone.app>,\
          SKIP_MIGRATION=true,\
          FRONTEND_URL=${{ secrets.FRONTEND_URL || 'https://bestchoice-prod.web.app' }},\
          COOKIE_DOMAIN=.bestchoicephone.app,\
          JWT_EXPIRATION=15m,\
          JWT_REFRESH_EXPIRATION=7d,\
          DATABASE_CONNECTION_LIMIT=10,\
          DATABASE_POOL_TIMEOUT=15,\
          PAYSOLUTIONS_MERCHANT_ID=09753259,\
          PAYSOLUTIONS_API_URL=https://apis.paysolutions.asia,\
          PAYSOLUTIONS_RETURN_URL=https://liff.line.me/2009442540-d9XnzWwl/contract,\
          PAYSOLUTIONS_TERMINAL_ID=TID00001,\
          GCS_BUCKET=bestchoice-documents,\
          API_BASE_URL=https://api.bestchoicephone.app,\
          SHOP_BASE_URL=https://www.bestchoicephone.com,\
          LIFF_CHANNEL_ID=2009442540,\
          LINE_LOGIN_CHANNEL_ID=2009442540,\
          SMS_PAYMENT_REMINDER_DISABLED=true,\
          FB_BOT_DISABLED=true,\
          FB_BOT_WHITELIST_PSIDS=8830107663706216;8355380127892529;29329154600008963,\
          FACEBOOK_APP_ID=2736219233418171,\
          LINE_FINANCE_BOT_DISABLED=true,\
          LINE_SHOP_BOT_DISABLED=true,\
          GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},\
          VERTEX_LOCATION=us-central1,\
          VERTEX_EMBEDDING_MODEL=text-multilingual-embedding-002" \
            --set-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --allow-unauthenticated

      - name: Grant runtime SA Token Creator (GCS V4 signed-URL uploads)
        run: |
          # GCS V4 presigned upload URLs (/shop/upload/signed-url → bank slip,
          # trade-in, voice memo) require the Cloud Run runtime SA to sign via the
          # IAM signBlob API, i.e. roles/iam.serviceAccountTokenCreator on ITSELF.
          # Without it getSignedUrl() throws → 500 on upload. Idempotent + non-fatal
          # so a missing-IAM-perm on the deploy SA can never block a deploy.
          SA=$(gcloud run services describe bestchoice-api \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ secrets.GCP_REGION || 'asia-southeast1' }}" \
            --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)
          if [ -z "$SA" ]; then
            PN=$(gcloud projects describe "${{ secrets.GCP_PROJECT_ID }}" --format='value(projectNumber)')
            SA="${PN}-compute@developer.gserviceaccount.com"
          fi
          echo "Runtime SA: $SA"
          gcloud iam service-accounts add-iam-policy-binding "$SA" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --member="serviceAccount:$SA" \
            --role="roles/iam.serviceAccountTokenCreator" \
            && echo "::notice::Token Creator granted to $SA (or already present) — GCS signed-URL uploads enabled" \
            || echo "::warning::Could not grant Token Creator to $SA — deploy SA likely lacks IAM perms; grant it manually (Cloud Shell): gcloud iam service-accounts add-iam-policy-binding $SA --member=serviceAccount:$SA --role=roles/iam.serviceAccountTokenCreator"

      - name: Verify deployment
        run: |
          API_URL=$(gcloud run services describe bestchoice-api \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=${{ secrets.GCP_REGION || 'asia-southeast1' }} \
            --format='value(status.url)')
          echo "API deployed to: ${API_URL}"
          curl -sf "${API_URL}/api/health" || (echo "Health check failed" && exit 1)

  # ============================================
  # Job 5: Deploy Frontend to Firebase Hosting
  # 2026-09-05: ไม่ติดตั้ง deps ไม่ build ซ้ำแล้ว — ใช้ dist จาก build-web ผ่าน artifact
  # (เดิม job นี้ install + Chromium + build ทั้งสองแอปใหม่อีกรอบ = 5 นาทีครึ่ง)
  # ============================================
  deploy-web:
    name: Deploy Web to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # "Lint & Test" = job สรุปทุก gate (success แม้ gate ถูกข้ามด้วยทางลัดฉุกเฉิน) + ต้องมี artifact จาก build-web
    needs: [lint-and-test, build-web]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.lint-and-test.result == 'success' && needs.build-web.result == 'success'

    steps:
      # ต้องการแค่ firebase.json + .firebaserc จาก repo — dist ทั้งสองมาจาก build-web
      - uses: actions/checkout@v4

      - name: Download admin web dist (from build-web)
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Download shop dist (from build-web, prerendered)
        uses: actions/download-artifact@v4
        with:
          name: shop-dist
          path: apps/web-shop/dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy admin hosting (bestchoicephone.app)
        run: |
          firebase deploy \
            --only hosting:admin \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --non-interactive

      - name: Deploy shop hosting (www.bestchoicephone.com)
        # เดิมตั้ง continue-on-error: true ไว้ตอนที่ site `bestchoicephone-shop` ยังไม่มีจริง
        # ตอนนี้ site + custom domain ขึ้นแล้ว การปล่อยให้ล้มแบบเงียบ ๆ แปลว่า
        # "deploy เขียว แต่หน้าร้านค้างของเก่า" ซึ่งไม่มีใครรู้ตัว — ต้องให้ job แดง
        run: |
          firebase deploy \
            --only hosting:shop \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --non-interactive

      - name: Verify shop is actually live
        # กัน "deploy ผ่านแต่หน้าร้านไม่ขึ้น" — เดิม step deploy ตั้ง continue-on-error
        # ไว้ จึงเป็นไปได้ที่ CI เขียวแต่โดเมนค้างของเก่าโดยไม่มีใครรู้
        #
        # เช็ค 2 origin แล้ว "แดงเมื่อพังทั้งคู่" เท่านั้น เพราะ 2 กรณีนี้ต่างกัน:
        #   - hosting deploy พังจริง        → ตายทั้งคู่        → ต้องแดง
        #   - custom domain ยังผูกไม่เสร็จ  → www ยังไม่ขึ้นแต่ web.app ปกติ → ไม่ควรแดง
        run: |
          set -uo pipefail
          # ห้ามใช้ `printf "$body" | grep -q` ตรงนี้: ใต้ pipefail `grep -q` ปิดท่อทันทีที่เจอคำ
          # พอ body ใหญ่กว่า pipe buffer printf โดน SIGPIPE → pipeline ล้มทั้งที่เจอ (www=0 legacy=0 หลอก
          # ทุก deploy ตั้งแต่หน้าร้าน prerender โตขึ้น — run 34558743170 / 34560494794) จึงเทียบในเชลล์ตรง ๆ
          check() {
            body=$(curl -fsS --max-time 20 "$1" 2>/dev/null || true)
            case "$body" in *BESTCHOICE*) return 0 ;; *) return 1 ;; esac
          }
          www_ok=0; legacy_ok=0
          for i in 1 2 3; do
            check https://www.bestchoicephone.com/ && www_ok=1
            check https://bestchoicephone-shop.web.app/ && legacy_ok=1
            [ "$www_ok" = 1 ] && break
            echo "รอบ $i: www ยังไม่ขึ้น (web.app=$legacy_ok) — รอ 15 วิ"
            sleep 15
          done
          echo "www=$www_ok legacy=$legacy_ok"
          if [ "$www_ok" = 1 ]; then
            echo "หน้าร้านขึ้นบน www.bestchoicephone.com แล้ว"
          elif [ "$legacy_ok" = 1 ]; then
            echo "::warning::www.bestchoicephone.com ยังไม่เสิร์ฟหน้าร้าน (custom domain น่าจะยังผูกไม่เสร็จ) แต่ bestchoicephone-shop.web.app ปกติ ⇒ deploy สำเร็จ"
          else
            echo "::error::หน้าร้านไม่ขึ้นทั้ง www และ bestchoicephone-shop.web.app — hosting deploy น่าจะพังจริง"
            exit 1
          fi
