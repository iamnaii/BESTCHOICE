name: ราคากลางรับซื้อ AppleHouse — ดึงทุก 2 สัปดาห์

# ดึงราคารับซื้อ iPhone เกรด A จาก applehouseth.com ทุก 2 สัปดาห์ แล้วนำเข้าระบบจริงเอง
# (คำสั่งเจ้าของ 2026-11-20 "นำเข้าราคาเองทุกรอบ ไม่ต้องรอคนกด" — แทนรอบเดิมที่เปิด PR ให้ merge)
#
#   1. ดึงราคา (scripts/collect-applehouse-valuations.cjs) + ตรวจรูปแบบ (scripts/applehouse-price-diff.cjs --check)
#   2. ส่งราคาเข้า Cloud Run Job ด้วย image เดียวกับ API ที่รันอยู่ (ตัวแปร APPLEHOUSE_SNAPSHOT_B64 — ไม่ต้อง commit/deploy)
#   3. ตัวนำเข้า (apps/api/prisma/seed-sell-valuations-applehouse.ts --apply --guard) เทียบกับราคาในฐานจริง:
#      ด่านตรวจผ่าน = บันทึก · ไม่ผ่าน (ราคาขยับ ≥ 15% หรือรุ่นหาย ≥ 20% — applehouse-import-plan.ts
#      checkImportGuard) = ไม่บันทึกอะไร run ล้ม (GitHub ส่งอีเมลแจ้ง) ให้คนตรวจในหน้า run แล้วกดรันเองแบบ force
#   ผลทุกรอบสรุปในหน้า run · ไฟล์ราคาที่ดึงได้เก็บเป็น artifact 90 วัน
#
# กดรันเอง: auto = เหมือนรอบตั้งเวลา · preview = ดูอย่างเดียว · force = บันทึกโดยข้ามด่านตรวจ (หลังคนตรวจแล้ว)

on:
  schedule:
    # จันทร์ 09:00 น. เวลาไทยทุกสัปดาห์ — ขั้นแรกกรองให้เหลือสัปดาห์เว้นสัปดาห์
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = บันทึกเมื่อด่านตรวจผ่าน · preview = ดูอย่างเดียว · force = บันทึกโดยข้ามด่านตรวจ'
        type: choice
        options: [auto, preview, force]
        default: auto
  pull_request:
    paths:
      - .github/workflows/applehouse-prices-refresh.yml
      - scripts/collect-applehouse-valuations.cjs
      - scripts/applehouse-price-diff.cjs

concurrency:
  group: applehouse-prices-refresh
  cancel-in-progress: false

env:
  SNAPSHOT: apps/api/prisma/data/applehouse-valuations.json
  JOB: bestchoice-applehouse-prices
  REGION: ${{ secrets.GCP_REGION || 'asia-southeast1' }}

jobs:
  refresh:
    name: ดึงราคาและนำเข้า
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: รอบนี้ต้องทำไหม
        id: gate
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          # เลขสัปดาห์นับจาก epoch — สัปดาห์คี่ = 30 พ.ย. 69, 14 ธ.ค. 69, … · กดรันเองหรือ PR = รันเสมอ
          week=$(( $(date -u +%s) / 604800 ))
          if [ "${{ github.event_name }}" = "schedule" ] && [ $(( week % 2 )) -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "สัปดาห์นี้ไม่ใช่รอบดึง (สัปดาห์ที่ $week)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          # PR = ทดสอบการดึงอย่างเดียว ไม่แตะระบบจริง
          if [ "${{ github.event_name }}" = "pull_request" ]; then mode=none; else mode="${INPUT_MODE:-auto}"; fi
          if [ "$mode" != "none" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::นำเข้าได้จาก main เท่านั้น"; exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '24'

      - name: ติดตั้ง Playwright Chromium (แยกจาก workspace — ไม่ต้อง npm ci ทั้ง monorepo)
        if: steps.gate.outputs.run == 'true'
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "playwright@$version"
          npx playwright install --with-deps chromium

      - name: ดึงราคาจาก AppleHouse
        if: steps.gate.outputs.run == 'true'
        run: |
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/collect-applehouse-valuations.cjs
          node scripts/applehouse-price-diff.cjs --check "$SNAPSHOT"

      - name: เก็บไฟล์ราคาที่ดึงได้
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: applehouse-valuations-${{ github.run_id }}
          path: ${{ env.SNAPSHOT }}
          retention-days: 90

      - name: Authenticate to GCP
        if: steps.gate.outputs.mode != 'none' && steps.gate.outputs.run == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        if: steps.gate.outputs.mode != 'none' && steps.gate.outputs.run == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: นำเข้าระบบจริง (${{ steps.gate.outputs.mode }})
        if: steps.gate.outputs.mode != 'none' && steps.gate.outputs.run == 'true'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          SQL: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
        run: |
          # image เดียวกับ API ที่รันอยู่ — ตัวนำเข้าเป็นโค้ดชุดเดียวกับระบบจริง
          image=$(gcloud run services describe bestchoice-api --project="$PROJECT" --region="$REGION" \
            --format='value(spec.template.spec.containers[0].image)')
          case "$MODE" in
            auto) args="tsx,apps/api/prisma/seed-sell-valuations-applehouse.ts,--apply,--guard" ;;
            force) args="tsx,apps/api/prisma/seed-sell-valuations-applehouse.ts,--apply" ;;
            *) args="tsx,apps/api/prisma/seed-sell-valuations-applehouse.ts" ;;
          esac
          ARGS=(
            --project="$PROJECT" --region="$REGION" --image="$image"
            --set-secrets=DATABASE_URL=DATABASE_URL:latest
            --set-cloudsql-instances="$SQL"
            --command=npx --args="$args"
            --max-retries=0 --task-timeout=300s
          )
          gcloud run jobs update "$JOB" "${ARGS[@]}" 2>/dev/null || gcloud run jobs create "$JOB" "${ARGS[@]}"

          snapshot_b64=$(node -e "process.stdout.write(Buffer.from(JSON.stringify(require('./$SNAPSHOT'))).toString('base64'))")
          status=0
          execution=$(gcloud run jobs execute "$JOB" --project="$PROJECT" --region="$REGION" --wait \
            --update-env-vars="APPLEHOUSE_SNAPSHOT_B64=$snapshot_b64" \
            --format='value(metadata.name)') || status=$?

          log="$RUNNER_TEMP/import.log"
          : > "$log"
          if [ -n "$execution" ]; then
            sleep 20  # log ของ Cloud Run เข้า Logging ช้ากว่าตัวงานเล็กน้อย
            gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND labels.\"run.googleapis.com/execution_name\"=\"$execution\"" \
              --project="$PROJECT" --order=asc --limit=300 --format='value(textPayload)' > "$log" 2>/dev/null || true
          fi
          {
            case "$MODE" in
              auto) echo "## นำเข้าอัตโนมัติ (มีด่านตรวจ)" ;;
              force) echo "## นำเข้าโดยข้ามด่านตรวจ" ;;
              *) echo "## ดูอย่างเดียว (ยังไม่บันทึก)" ;;
            esac
            echo ""
            echo '```'
            # ตัดบรรทัดราคาเท่าเดิมและข้อความของ npm ออกให้สั้น
            grep -v -e '^ราคาเท่าเดิม' -e '^npm notice' -e '^Container called' -e '^$' "$log" || echo "(อ่าน log ไม่ได้ — ดู Cloud Run Job $execution)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q 'GUARD_BLOCKED' "$log"; then
            echo "::error::ด่านตรวจไม่ผ่าน — ยังไม่บันทึกราคา · ดูเหตุผลในสรุปของ run นี้ ถ้าราคาถูกต้องจริงให้กด Run workflow เลือก force"
            exit 1
          fi
          exit $status
