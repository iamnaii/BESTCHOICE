<script>
const paths={back:'<path d="m15 18-6-6 6-6"/>',down:'<path d="m6 9 6 6 6-6"/>',more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',home:'<path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3z"/>',box:'<path d="m3 7 9-4 9 4v13H3zM3 7l9 4 9-4M12 11v9"/>',file:'<path d="M5 3h10l4 4v14H5zM14 3v5h5M9 12h6M9 16h6"/>',chat:'<path d="M3 4h18v14H8l-5 3zM7 9h10M7 13h7"/>',plus:'<path d="M12 4v16M4 12h16"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',send:'<path d="m3 3 18 9-18 9 3-9zM6 12h15"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>',image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/>',quick:'<path d="M3 4h18v14H9l-6 3zM7 8h3v4H7zM14 8h3v4h-3z"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',check:'<path d="m5 12 4 4 10-10"/>',at:'<circle cx="11" cy="12" r="4"/><path d="M15 8v7c0 3 6 2 6-3a9 9 0 1 0-4 7"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/>',pin:'<path d="M8 3h8l-1 7 4 4H5l4-4zM12 14v8"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',bot:'<rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M8 12h.1M16 12h.1M8 16h8"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',cloud:'<path d="M6 18a5 5 0 1 1 1-10 6 6 0 0 1 11 2 4 4 0 0 1 0 8z"/>',offer:'<path d="M4 3h16v18H4zM8 7h8M8 11h8M8 15h4"/>',smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14a4 4 0 0 0 8 0M8 8h.1M16 8h.1"/>',theme:'<path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11z"/>'};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const draw=()=>$$('[data-icon]').forEach(e=>e.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+(paths[e.dataset.icon]||paths.chat)+'</svg>');
const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baseMessages=[{type:'in',text:'สนใจ iPhone 15 ค่ะ\nมีสีฟ้าพร้อมรับวันนี้ไหมคะ',time:'10:24'},{type:'out',text:'มีพร้อมค่ะ เดี๋ยวส่งรูปเครื่องให้ดูนะคะ',time:'10:25',read:true},{type:'note',text:'@เมย์ เช็กสีฟ้า 128GB ให้คุณพลอยแล้ว เครื่องพร้อมค่ะ',time:'10:26',author:'นัท'},{type:'in',text:'ขอดูรูปเครื่องหน่อยค่ะ\nช่วงบ่ายจะเข้าไปรับ 😊',time:'10:28'}];
const rooms=[{id:'ploy',name:'พลอย วัฒนกุล',initial:'พ',channel:'LINE หน้าร้าน',preview:'ขอดูรูปเครื่องหน่อยค่ะ',time:'10:28',unread:2,assignee:'นัท',pinned:true,messages:structuredClone(baseMessages)},{id:'art',name:'อาร์ต',initial:'อ',channel:'LINE หน้าร้าน',preview:'ผ่อนเดือนละเท่าไรครับ',time:'10:21',unread:1,assignee:'เมย์',messages:[{type:'in',text:'iPhone 15 ผ่อนเดือนละเท่าไรครับ',time:'10:21'}]},{id:'orathai',name:'อรทัย',initial:'อ',channel:'Facebook',preview:'สะดวกไปช่วงบ่ายค่ะ',time:'10:12',unread:0,assignee:'เมย์',messages:[{type:'in',text:'สะดวกไปช่วงบ่ายค่ะ',time:'10:12'}]},{id:'thanakorn',name:'ธนกร',initial:'ธ',channel:'LINE หน้าร้าน',preview:'คุณ: รับเรื่องตรวจเครื่องแล้วครับ',time:'09:56',unread:0,assignee:'นัท',messages:[{type:'in',text:'ขอส่งเครื่องตรวจเช็กครับ',time:'09:54'},{type:'out',text:'รับเรื่องตรวจเครื่องแล้วครับ',time:'09:56'}]},{id:'mint',name:'มิ้นท์',initial:'ม',channel:'LINE หน้าร้าน',preview:'ขอบคุณมากค่ะ',time:'เมื่อวาน',unread:0,assignee:'เมย์',messages:[{type:'in',text:'ขอบคุณมากค่ะ',time:'16:30'}]},{id:'wirot',name:'วิโรจน์',initial:'ว',channel:'Facebook',preview:'คุณ: ส่งรายละเอียดให้แล้วครับ',time:'เมื่อวาน',unread:0,assignee:'นัท',messages:[{type:'out',text:'ส่งรายละเอียดให้แล้วครับ',time:'14:05'}]}].map(r=>({...r,mode:'chat',drafts:{chat:'',note:''},attachment:false,quote:'',resolved:false,ai:false,muted:false}));
const tasks=[{id:'check',room:'ploy',icon:'at',kind:'กล่าวถึงคุณ',title:'เช็กเครื่องให้คุณพลอย',text:'นัท: @เมย์ เช็กสีฟ้า 128GB ให้คุณพลอยแล้ว เครื่องพร้อมค่ะ',time:'2 นาทีที่แล้ว'},{id:'visit',room:'orathai',icon:'calendar',kind:'ติดตามวันนี้ · 14:00',title:'ยืนยันเวลารับเครื่อง',text:'คุณอรทัย · ผู้รับผิดชอบ เมย์',time:'รอดำเนินการ'},{id:'repair',room:'thanakorn',icon:'user',kind:'ส่งต่องาน',title:'ตรวจเครื่องของคุณธนกร',text:'นัทส่งต่อให้ทีมบริการ',time:'10 นาทีที่แล้ว'}];
const draft=$('#draft'),composer=$('.composer'),dialog=$('dialog'),send=$('.send');let currentId='ploy',screen='room',tab='customers',filterUnread=false,mode='chat',attachment=false,opener,toastTimer;const queries={customers:'',team:''};let listScroll=0;
const current=()=>rooms.find(r=>r.id===currentId);
function announce(t){$('.notice').textContent=t;$('.notice').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('.notice').hidden=true,2400)}
function saveDraft(){const r=current();r.drafts[mode]=draft.value;r.mode=mode;r.attachment=attachment}
function resize(){const log=$('.history'),stick=log.scrollHeight-log.scrollTop-log.clientHeight<32;draft.style.height='auto';draft.style.height=Math.min(draft.scrollHeight,innerHeight<500?76:112)+'px';saveDraft();const ready=!!draft.value.trim()||(mode==='chat'&&attachment);composer.classList.toggle('is-typing',!!draft.value||mode==='note');send.classList.toggle('ready',ready);send.disabled=mode==='note'&&!ready;send.setAttribute('aria-label',mode==='note'?'บันทึกโน้ตภายใน':ready?'ส่งข้อความ':'พูดเป็นข้อความ');send.firstElementChild.dataset.icon=mode==='note'?'check':ready?'send':'mic';$('.attachments').hidden=mode!=='chat'||!attachment;draw();if(stick)log.scrollTop=log.scrollHeight}
function updateRoomHeader(){const r=current();$('#room-name').textContent=r.name;$('#room-avatar').textContent=r.initial;$('#room-meta').textContent=r.channel+' · '+(r.resolved?'ปิดงานแล้ว':r.unread?'รอตอบ 8 นาที':r.assignee+' ดูแล');$('.room-status').hidden=!r.ai;$('#room-status-text').textContent='บอทกำลังตอบ · เมนูห้องใช้สลับผู้ตอบได้'}
function setMode(next){saveDraft();mode=next;current().mode=next;draft.value=current().drafts[next];composer.dataset.mode=mode;$('#mode-label').textContent=mode==='note'?'โน้ตภายใน · ลูกค้าไม่เห็น':'ตอบลูกค้า';$('.mode-button>span').dataset.icon=mode==='note'?'lock':'chat';$('#quick-label').textContent=mode==='note'?'เรียกทีม':'ตอบด่วน';$('.quick-button>span').dataset.icon=mode==='note'?'at':'quick';draft.placeholder=mode==='note'?'ฝากข้อความถึงทีม…':'ข้อความ…';$('label[for=draft]').textContent=mode==='note'?'โน้ตภายในสำหรับทีม':'ข้อความถึง'+current().name;$('.image-shortcut').hidden=mode==='note';$('.reply-quote').hidden=mode==='note'||!current().quote;$('.reply-quote p').textContent=current().quote;$('.tools-tray').hidden=true;$('#more-tools').setAttribute('aria-expanded','false');$('#more-tools>span').dataset.icon='plus';resize()}
function renderMessages(scroll=true){const r=current();$('.history').innerHTML='<div class="date"><span>วันนี้ · 15 ต.ค.</span></div>'+r.messages.map((m,i)=>m.type==='note'?'<div class="message internal" data-message="'+i+'"><span class="internal-label"><span data-icon="lock"></span>โน้ตภายใน · '+escapeHtml(m.author||'คุณ')+'</span>'+escapeHtml(m.text).replace(/\n/g,'<br>')+'<time class="internal-time">'+m.time+'</time></div>':'<div class="message '+(m.type==='out'?'out':'')+'" data-message="'+i+'">'+(m.type==='in'?'<div class="avatar" aria-hidden="true">'+r.initial+'</div>':'<time class="message-status"><span>'+(m.read?'อ่านแล้ว':'ส่งแล้ว')+'</span>'+m.time+'</time>')+'<button class="bubble" data-message-action="'+i+'" aria-label="ตัวเลือกข้อความ '+escapeHtml(m.text.slice(0,50))+'">'+(m.quote?'<span class="quote-in-bubble">'+escapeHtml(m.quote)+'</span>':'')+(m.media?'<span class="media-bubble"><span data-icon="phone"></span>รูปเครื่องตัวอย่าง.jpg</span>':'')+escapeHtml(m.text)+'</button>'+(m.type==='in'?'<time class="message-status">'+m.time+'</time>':'')+'</div>').join('');draw();if(scroll)$('.history').scrollTop=$('.history').scrollHeight}
function renderList(){const q=queries[tab].trim().toLowerCase();$('#room-search').value=queries[tab];$('#customer-count').textContent=rooms.reduce((s,r)=>s+r.unread,0);$$('.tab').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===tab));b.tabIndex=b.dataset.tab===tab?0:-1});$('[data-action=filter]').hidden=tab==='team';$('[data-action=filter]').setAttribute('aria-pressed',String(filterUnread));$('#list-caption').textContent=tab==='team'?'งานที่เกี่ยวข้องกับคุณ':filterUnread?'ยังไม่อ่าน':'แชทล่าสุด';
if(tab==='team'){const items=tasks.filter(t=>(t.title+' '+t.text).toLowerCase().includes(q));$('#list-total').textContent=items.length+' งาน';$('#room-list').innerHTML=items.map(t=>'<button class="team-row" data-task="'+t.id+'"><span class="team-symbol" data-icon="'+t.icon+'"></span><span class="grow"><span class="team-kind">'+t.kind+'</span><strong>'+t.title+'</strong><p>'+t.text+'</p><small>'+t.time+'</small></span></button>').join('')||emptyList();}
else{const items=rooms.filter(r=>(!filterUnread||r.unread>0)&&(r.name+' '+r.preview).toLowerCase().includes(q));$('#list-total').textContent=items.length+' ห้อง';$('#room-list').innerHTML=items.map(r=>'<button class="room-row" data-room="'+r.id+'"><span class="avatar '+(r.unread?'':'neutral')+'">'+r.initial+'</span><span class="grow"><span class="row-heading"><strong>'+r.name+'</strong><time>'+r.time+'</time></span><span class="row-preview"><p>'+(r.drafts.chat?'<span class="draft-label">ร่าง: </span>'+escapeHtml(r.drafts.chat):escapeHtml(r.preview))+'</p>'+(r.unread?'<span class="badge" aria-label="'+r.unread+' ข้อความยังไม่อ่าน">'+r.unread+'</span>':'')+'</span><span class="row-meta">'+r.channel+(r.pinned?'<span class="pin" data-icon="pin"></span>':'')+'</span></span></button>').join('')||emptyList();}draw()}
function emptyList(){return '<div class="empty"><strong>ไม่พบรายการ</strong><p>ลองค้นหาด้วยชื่อหรือคำสั้น ๆ</p><button data-action="reset-search">แสดงทั้งหมด</button></div>'}
function showList(){if(screen==='room')saveDraft();screen='list';$('#room-screen').hidden=true;$('#list-screen').hidden=false;renderList();$('#room-list').scrollTop=listScroll;dialog.close()}
function showRoom(id,nextMode){if(screen==='room')saveDraft();if(!rooms.some(r=>r.id===id))id='ploy';currentId=id;screen='room';mode=current().mode;attachment=current().attachment;draft.value=current().drafts[mode];$('#list-screen').hidden=true;$('#room-screen').hidden=false;updateRoomHeader();setMode(nextMode||mode);renderMessages();dialog.close()}
function navRoom(id,nextMode){listScroll=$('#room-list').scrollTop;history.pushState({screen:'room',room:id,fromList:true,tab},'',urlFor('room',id));showRoom(id,nextMode)}
function urlFor(s,id){const u=new URL(location.href);u.searchParams.set('screen',s);u.searchParams.delete('state');if(id)u.searchParams.set('room',id);else u.searchParams.delete('room');return u.pathname+u.search}
function back(){if(history.state?.fromList)history.back();else{history.replaceState({screen:'list',tab},'',urlFor('list'));showList()}}
window.addEventListener('popstate',e=>{tab=e.state?.tab||tab;e.state?.screen==='room'?showRoom(e.state.room):showList()});
function sheet(title,sub,html,button){opener=button||document.activeElement;dialog.classList.remove('quick-mode');$('#dialog-title').textContent=title;$('#dialog-subtitle').textContent=sub;$('.dialog-content').innerHTML=html;draw();if(!dialog.open)dialog.showModal()}
const row=(icon,label,action,extra='')=>'<button class="sheet-row" data-sheet="'+action+'"><span data-icon="'+icon+'"></span>'+label+extra+'</button>';
function openPanel(kind,b){const r=current();if(kind==='quick'){if(mode==='note'){openPanel('mention',b);return}openQuick(b);return}if(kind==='info'){sheet(r.name,'ข้อมูลลูกค้า', '<dl class="sheet-details"><dt>ช่องทาง</dt><dd>'+r.channel+'</dd><dt>ผู้ดูแล</dt><dd>'+r.assignee+'</dd><dt>สาขา</dt><dd>ลาดพร้าว</dd><dt>สนใจ</dt><dd>iPhone 15 · 128GB</dd></dl>'+row('user','เปลี่ยนผู้ดูแล','assign')+row('calendar','นัดดูเครื่อง','appointment'),b)}
if(kind==='mode')sheet('เลือกการตอบ','','<button class="sheet-row" data-mode="chat" aria-pressed="'+(mode==='chat')+'"><span data-icon="chat"></span>ตอบลูกค้า</button><button class="sheet-row" data-mode="note" aria-pressed="'+(mode==='note')+'"><span data-icon="lock"></span>โน้ตภายใน<small>ลูกค้าไม่เห็น</small></button>',b);
if(kind==='room-menu')sheet('ตัวเลือกห้อง',r.name,row('info','ข้อมูลลูกค้า','info')+row('user','มอบหมายผู้ดูแล','assign')+row('pin',r.pinned?'ถอดหมุดห้องนี้':'ปักหมุดห้องนี้','pin')+row('bot',r.ai?'เปลี่ยนเป็นพนักงานตอบ':'ให้บอทตอบ','bot')+row('bell',r.muted?'เปิดแจ้งเตือน':'ปิดแจ้งเตือน','mute')+row('check',r.resolved?'เปิดงานอีกครั้ง':'ปิดงาน','resolve'),b);

if(kind==='files')sheet('แนบรูปหรือไฟล์','เลือกรูปตัวอย่างก่อนส่ง','<div class="file-choice"><div class="phone-image"><span data-icon="phone"></span></div><div><strong>รูปเครื่องตัวอย่าง.jpg</strong><small>ไฟล์ตัวอย่างสำหรับลองใช้งาน</small></div></div><button class="full-button" data-sheet="stage-file">แนบรูปนี้</button>',b);
if(kind==='voice')sheet('พูดเป็นข้อความ','ตัวอย่างการแปลงเสียง','<p class="sheet-sample">เครื่องสีฟ้ามีพร้อมค่ะ แวะมาดูที่สาขาได้เลย</p><button class="full-button" data-insert="เครื่องสีฟ้ามีพร้อมค่ะ แวะมาดูที่สาขาได้เลย">ใช้ข้อความนี้</button><p class="sheet-note">ต้นแบบไม่เปิดไมโครโฟนจริง</p>',b);

if(kind==='product')sheet('เลือกสินค้า','ตัวอย่างสินค้า','<div class="file-choice"><div class="phone-image"><span data-icon="phone"></span></div><div><strong>iPhone 15 · 128GB</strong><small>สีฟ้า · พร้อมดูเครื่อง</small></div></div><button class="full-button" data-insert="iPhone 15 สีฟ้า 128GB พร้อมให้ดูเครื่องที่สาขาค่ะ">ใส่รายละเอียดในข้อความ</button>',b);

}
function insert(text){const a=draft.selectionStart??draft.value.length,b=draft.selectionEnd??a;draft.value=draft.value.slice(0,a)+text+draft.value.slice(b);resize();opener=draft;dialog.close();requestAnimationFrame(()=>{draft.focus();draft.setSelectionRange(a+text.length,a+text.length)})}
function toggleTools(){const log=$('.history'),stick=log.scrollHeight-log.scrollTop-log.clientHeight<32;const tray=$('.tools-tray'),show=tray.hidden;tray.hidden=!show;$('#more-tools').setAttribute('aria-expanded',String(show));$('#more-tools').setAttribute('aria-label',show?'ปิดเครื่องมือแนบ':'เปิดเครื่องมือแนบ');$('#more-tools>span').dataset.icon=show?'close':'plus';const items=mode==='note'?[['at','เรียกทีม','mention'],['smile','อีโมจิ','emoji']]:[['image','รูป / ไฟล์','files'],['cloud','คลังไฟล์','files'],['phone','สินค้า','product'],['offer','เตรียมข้อเสนอ','offer'],['quick','ตอบด่วน','quick'],['smile','อีโมจิ','emoji']];tray.innerHTML=items.map(([icon,label,open])=>'<button class="tool-tile" data-open="'+open+'"><span data-icon="'+icon+'"></span><span>'+label+'</span></button>').join('');draw();if(stick)log.scrollTop=log.scrollHeight}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.room){navRoom(b.dataset.room);return}if(b.dataset.task){const t=tasks.find(t=>t.id===b.dataset.task);navRoom(t.room,'note');const note=$('.message.internal');if(note){note.classList.add('highlight');note.scrollIntoView({block:'center'})}return}
if(b.dataset.tab){queries[tab]=$('#room-search').value;tab=b.dataset.tab;history.replaceState({...history.state,tab},'');renderList();return}
if(b.dataset.open){openPanel(b.dataset.open,b);return}if(b.dataset.mode){setMode(b.dataset.mode);opener=draft;dialog.close();draft.focus();return}
if(b.dataset.insert!==undefined){insert(b.dataset.insert);return}
if(b.dataset.messageAction!==undefined){const m=current().messages[Number(b.dataset.messageAction)];sheet('ข้อความ','', '<p class="sheet-sample">'+escapeHtml(m.text)+'</p><button class="sheet-row" data-reply-message="'+b.dataset.messageAction+'"><span data-icon="chat"></span>ตอบกลับข้อความนี้</button>',b);return}
if(b.dataset.replyMessage!==undefined){current().quote=current().messages[Number(b.dataset.replyMessage)].text;setMode('chat');$('.reply-quote p').textContent=current().quote;$('.reply-quote').hidden=false;opener=draft;dialog.close();draft.focus();return}
if(b.dataset.assignee){current().assignee=b.dataset.assignee;updateRoomHeader();dialog.close();announce('เปลี่ยนผู้ดูแลในต้นแบบแล้ว');return}
if(b.dataset.demo==='outside'){announce('ต้นแบบนี้เปิดให้ลองเฉพาะหน้าแชท');return}
switch(b.dataset.action){case'back':back();return;case'list':showList();return;case'filter':filterUnread=!filterUnread;renderList();return;case'reset-search':queries[tab]='';filterUnread=false;renderList();return;case'close-dialog':dialog.close();return;case'tools':toggleTools();return;case'remove-file':attachment=false;resize();return;case'cancel-quote':current().quote='';$('.reply-quote').hidden=true;return}
if(b.dataset.sheet){const r=current();switch(b.dataset.sheet){case'info':openPanel('info',opener);return;case'assign':sheet('มอบหมายผู้ดูแล','', ['เมย์','นัท'].map(n=>'<button class="sheet-row" data-assignee="'+n+'"><span data-icon="user"></span>'+n+'</button>').join(''),opener);return;case'appointment':sheet('นัดดูเครื่อง','ตัวอย่างข้อมูลนัด','<dl class="sheet-details"><dt>วันที่</dt><dd>15 ต.ค. 2026</dd><dt>เวลา</dt><dd>14:00</dd><dt>สาขา</dt><dd>ลาดพร้าว</dd></dl><p class="sheet-note">ยังไม่มีการบันทึกนัดจริง</p>',opener);return;case'pin':r.pinned=!r.pinned;break;case'bot':r.ai=!r.ai;break;case'mute':r.muted=!r.muted;break;case'resolve':r.resolved=!r.resolved;break;case'theme':document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';break;case'unread':tab='customers';filterUnread=true;renderList();break;case'stage-file':attachment=true;$('.tools-tray').hidden=true;$('#more-tools').setAttribute('aria-expanded','false');$('#more-tools>span').dataset.icon='plus';resize();break;}updateRoomHeader();dialog.close();draw();}
});
draft.addEventListener('input',resize);$('#room-search').addEventListener('input',e=>{queries[tab]=e.target.value;renderList()});
$('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();tab=e.key==='Home'?'customers':e.key==='End'?'team':tab==='customers'?'team':'customers';history.replaceState({...history.state,tab},'');renderList();$('.tab[aria-selected=true]').focus()});
send.addEventListener('click',()=>{const ready=!!draft.value.trim()||(mode==='chat'&&attachment);if(!ready){if(mode==='chat')openPanel('voice',send);return}const r=current();r.messages.push({type:mode==='note'?'note':'out',text:draft.value,time:'10:30',author:'คุณ',media:mode==='chat'&&attachment,quote:mode==='chat'?r.quote:''});if(mode==='chat'){r.preview='คุณ: '+(draft.value||'รูปภาพ');r.time='10:30';r.unread=0;attachment=false;r.quote='';$('.reply-quote').hidden=true}draft.value='';resize();renderMessages();updateRoomHeader();announce(mode==='note'?'บันทึกโน้ตตัวอย่างแล้ว · ลูกค้าไม่เห็น':'แสดงข้อความตัวอย่างแล้ว · ไม่ได้ส่งจริง')});
dialog.addEventListener('close',()=>{if(opener?.isConnected)opener.focus({preventScroll:true})});dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()});
const params=new URLSearchParams(location.search);if(params.get('theme')==='dark')document.documentElement.dataset.theme='dark';tab=params.get('tab')==='team'?'team':'customers';const initialScreen=params.get('screen')==='list'?'list':'room';history.replaceState({screen:initialScreen,room:params.get('room')||'ploy',tab},'');if(initialScreen==='list')showList();else showRoom(params.get('room')||'ploy',params.get('state')==='note'?'note':undefined);if(params.get('state')==='typed'){draft.value='ได้เลยค่ะ เดี๋ยวส่งรูปให้ดูนะคะ';resize()}if(params.get('state')==='tools')toggleTools();if(params.get('state')==='note'){draft.value='@เมย์ ฝากเตรียมเครื่องให้คุณพลอยช่วงบ่ายค่ะ';resize()}
function viewport(){const log=$('.history'),stick=log.scrollHeight-log.scrollTop-log.clientHeight<32;document.documentElement.style.setProperty('--app-height',(window.visualViewport?.height||innerHeight)+'px');if(screen==='room'){resize();if(stick)log.scrollTop=log.scrollHeight}}window.visualViewport?.addEventListener('resize',viewport);window.addEventListener('resize',viewport);viewport();draw();
</script>
<script id="quick-v4-script">paths.search='<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>';
paths.next='<path d="m9 6 6 6-6 6"/>';
const quickTemplates=[
{id:'ready',title:'แจ้งสินค้ามีพร้อม',category:'สินค้า',shortcut:'ready',text:'คุณพลอย เครื่องรุ่นที่สนใจมีพร้อมค่ะ สะดวกเข้ามาดูที่สาขาช่วงเวลาไหนคะ'},
{id:'photos',title:'รายละเอียดและรูปเครื่อง',category:'สินค้า',shortcut:'photos',text:'คุณพลอย รูปเครื่องที่สนใจตามนี้ค่ะ หากต้องการดูมุมอื่นเพิ่มเติมแจ้งได้เลยนะคะ',media:true},
{id:'installment',title:'สอบถามรุ่นและงบดาวน์',category:'ผ่อน',shortcut:'down',text:'สนใจรุ่นไหน และมีงบดาวน์ที่สะดวกประมาณเท่าไรคะ เดี๋ยวช่วยเช็กตัวเลือกให้ค่ะ'},
{id:'appointment',title:'นัดดูเครื่องที่สาขา',category:'นัดหมาย',shortcut:'visit',text:'คุณพลอย สะดวกเข้ามาที่สาขาวันไหนและช่วงเวลาไหนคะ จะได้เตรียมเครื่องไว้ให้ดูค่ะ'},
{id:'documents',title:'ได้รับเอกสารแล้ว',category:'เอกสาร',shortcut:'received',text:'ได้รับเอกสารแล้วค่ะ กำลังตรวจสอบให้ หากต้องการข้อมูลเพิ่มเติมจะแจ้งอีกครั้งนะคะ'},
{id:'follow',title:'ติดตามหลังดูเครื่อง',category:'ติดตาม',shortcut:'follow',text:'คุณพลอย ยังสนใจเครื่องที่คุยไว้ไหมคะ หากมีข้อสงสัยหรือต้องการดูรุ่นอื่นเพิ่มเติมแจ้งได้เลยค่ะ'},
{id:'greeting',title:'ทักทายลูกค้า',category:'ทั่วไป',shortcut:'hello',text:'สวัสดีค่ะคุณพลอย สนใจดูรุ่นไหน หรือให้ช่วยแนะนำจากงบประมาณได้เลยนะคะ'}
];
const quickState={query:'',category:'ทั้งหมด',selected:null,scroll:0,edits:{},editing:false};
const escapeQuick=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const quickNav=document.createElement('button');quickNav.className='icon quick-nav';quickNav.dataset.quickNav='';quickNav.innerHTML='<span data-icon="back"></span>';$('.dialog-top').prepend(quickNav);
function renderQuickResults(){
  const q=quickState.query.trim().toLocaleLowerCase();
  const items=quickTemplates.filter(t=>(quickState.category==='ทั้งหมด'||t.category===quickState.category)&&(!q||[t.title,t.text,t.category,t.shortcut].some(v=>v.toLocaleLowerCase().includes(q))));
  $('.quick-count').textContent=items.length+' ข้อความ';
  $('.quick-results').innerHTML=items.length?items.map(t=>'<button class="quick-row-main" data-quick-preview="'+t.id+'" aria-label="ดูข้อความ '+t.title+'"><span class="quick-row-copy"><span class="quick-row-title">'+t.title+(t.media?'<span class="quick-media-label"><span data-icon="image"></span>1</span>':'')+'</span><span class="quick-snippet">'+escapeQuick(t.text)+'</span></span><span data-icon="next"></span></button>').join(''):'<div class="quick-empty"><strong>ไม่พบข้อความ</strong><p>ลองคำอื่น หรือเลือกหมวดทั้งหมด</p><button data-quick-reset>ดูข้อความทั้งหมด</button></div>';
  $('.quick-results').scrollTop=0;$('.quick-clear').hidden=!quickState.query;draw();
}
function renderQuickList(restore=false){
  quickState.selected=null;quickState.editing=false;$('#dialog-title').textContent='ข้อความสำเร็จรูป';quickNav.setAttribute('aria-label','กลับห้องสนทนา');
  const categories=['ทั้งหมด',...new Set(quickTemplates.map(t=>t.category))];
  $('.dialog-content').innerHTML='<label class="sr" for="quick-search">ค้นหาข้อความสำเร็จรูป</label><div class="quick-search"><span data-icon="search"></span><input id="quick-search" type="search" inputmode="search" placeholder="ค้นหาข้อความ" value="'+escapeQuick(quickState.query)+'"><button class="icon quick-clear" data-quick-clear aria-label="ล้างคำค้น"><span data-icon="close"></span></button></div><div class="quick-filter"><p class="quick-count" role="status"></p><label class="sr" for="quick-category">หมวดข้อความ</label><select id="quick-category">'+categories.map(c=>'<option'+(c===quickState.category?' selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="quick-results" aria-label="รายการข้อความสำเร็จรูป"></div>';
  renderQuickResults();if(restore)$('.quick-results').scrollTop=quickState.scroll;
}
function openQuick(button){
  quickTemplates.forEach(t=>{t.baseText??=t.text;t.text=t.baseText.replaceAll('คุณพลอย','คุณ'+current().name.split(' ')[0])});opener=button;dialog.classList.add('quick-mode');quickState.query='';quickState.category='ทั้งหมด';quickState.selected=null;quickState.scroll=0;quickState.edits={};renderQuickList();if(!dialog.open)dialog.showModal();quickNav.focus({preventScroll:true});
}
function renderQuickPreview(){
  const t=quickTemplates.find(t=>t.id===quickState.selected);if(!t)return;
  const text=quickState.edits[t.id]??t.text;
  $('#dialog-title').textContent='ตัวอย่างข้อความ';quickNav.setAttribute('aria-label','กลับรายการข้อความ');
  $('.dialog-content').innerHTML='<div class="quick-preview-recipient"><div class="avatar" aria-hidden="true">'+escapeQuick(current().initial)+'</div><div><strong>ถึง '+escapeQuick(current().name)+'</strong><small>'+escapeQuick(current().channel)+' · '+(t.media?'ข้อความและรูป 1 รูป':'1 ข้อความ')+'</small></div></div><div class="quick-preview-scroll"><div class="quick-preview-heading"><strong>'+t.title+'</strong><button class="quick-edit-toggle" data-quick-edit>'+(quickState.editing?'ดูตัวอย่าง':'แก้ข้อความ')+'</button></div>'+(quickState.editing?'<label class="sr" for="quick-edit">แก้ข้อความก่อนใช้</label><textarea class="quick-edit" id="quick-edit" rows="5">'+escapeQuick(text)+'</textarea>':'<p class="quick-bubble">'+escapeQuick(text)+'</p>')+(t.media?'<figure class="quick-media-preview"><div class="quick-photo" role="img" aria-label="ภาพจำลองโทรศัพท์"><span data-icon="phone"></span></div><figcaption>รูปเครื่องตัวอย่าง.jpg · ภาพจำลอง</figcaption></figure>':'')+(draft.value?'<p class="quick-original-draft">เพิ่มต่อท้ายข้อความที่พิมพ์ไว้</p>':'')+'</div><div class="quick-preview-footer"><button class="full-button" data-quick-use="'+t.id+'"'+(!text.trim()?' disabled':'')+'>'+(t.media?'ใช้ข้อความและรูป':'ใช้ข้อความนี้')+'</button><p>ใส่ในช่องพิมพ์ก่อนส่ง</p></div>';draw();
}
function previewQuick(id){if(!quickTemplates.some(t=>t.id===id))return;quickState.scroll=$('.quick-results')?.scrollTop??quickState.scroll;quickState.selected=id;quickState.editing=false;renderQuickPreview();quickNav.focus({preventScroll:true})}
function backQuick(){const id=quickState.selected;if(!id){dialog.close();return}renderQuickList(true);$('.quick-row-main[data-quick-preview="'+id+'"]')?.focus({preventScroll:true})}
function useQuick(id){
  const t=quickTemplates.find(t=>t.id===id);if(!t)return;const text=quickState.edits[id]??t.text;if(!text.trim())return;
  draft.value+=(draft.value?'\n\n':'')+text;if(t.media){attachment=true;$('.attachments').hidden=false}resize();opener=draft;dialog.close();requestAnimationFrame(()=>{draft.focus();draft.setSelectionRange(draft.value.length,draft.value.length)});announce('ใส่ข้อความแล้ว · แก้ไขก่อนกดส่งได้');
}
document.addEventListener('input',e=>{if(e.target.id==='quick-search'){quickState.query=e.target.value;renderQuickResults()}if(e.target.id==='quick-edit'){quickState.edits[quickState.selected]=e.target.value;$('.quick-preview-footer button').disabled=!e.target.value.trim()}});
document.addEventListener('change',e=>{if(e.target.id==='quick-category'){quickState.category=e.target.value;renderQuickResults()}});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.quickPreview)previewQuick(b.dataset.quickPreview);
  if(b.dataset.quickUse)useQuick(b.dataset.quickUse);
  if(b.hasAttribute('data-quick-nav'))backQuick();
  if(b.hasAttribute('data-quick-edit')){quickState.editing=!quickState.editing;renderQuickPreview();(quickState.editing?$('#quick-edit'):$('[data-quick-edit]')).focus({preventScroll:true})}
  if(b.hasAttribute('data-quick-reset')){quickState.query='';quickState.category='ทั้งหมด';renderQuickList();$('#quick-search').focus()}
  if(b.hasAttribute('data-quick-clear')){quickState.query='';$('#quick-search').value='';renderQuickResults();$('#quick-search').focus()}
});
dialog.addEventListener('cancel',e=>{if(dialog.classList.contains('quick-mode')&&quickState.selected){e.preventDefault();backQuick()}});
if(['quick','quick-preview','quick-media'].includes(params.get('state'))){openQuick($('[data-open=quick]'));if(params.get('state')==='quick-preview')previewQuick('ready');if(params.get('state')==='quick-media')previewQuick('photos')}
</script>
