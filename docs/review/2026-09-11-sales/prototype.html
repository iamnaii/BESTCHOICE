;gap:12px}.timeline{list-style:none;padding:0;margin:0}.timeline li{padding:10px 0 10px 25px;border-left:1px solid var(--line);position:relative;margin-left:6px}.timeline li:before{content:'';position:absolute;left:-5px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--green)}.timeline small{display:block}.tabs{display:flex;gap:15px;overflow:auto;white-space:nowrap;border-bottom:1px solid var(--line);margin-bottom:18px}.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;border-radius:0}.tabs .selected{border-color:var(--green);color:var(--green)}.callout{border-left:3px solid var(--green);padding:8px 16px;background:var(--pale)}dialog{width:min(560px,calc(100% - 28px));border:1px solid var(--line);border-radius:14px;padding:26px;color:var(--ink);background:var(--card)}dialog::backdrop{background:#14291c65}dialog p{color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.notice{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:24px;padding-top:14px}.hidden{display:none}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}a{color:var(--green)}@media(max-width:1080px){.grid{grid-template-columns:minmax(0,1fr) 290px}.side{width:200px}main{margin-left:200px}.wrap{padding:22px}.top{padding:0 22px}}@media(max-width:760px){.side{position:static;width:100%;padding:15px;gap:12px}.side .work,.side .eyebrow,.side .sidebar-note{display:none}.side nav{display:flex;overflow:auto;gap:4px}.side nav button{white-space:nowrap;flex-shrink:0;font-size:12px;gap:6px;padding:8px 12px}.side .navicon,.side .count{display:none}main{margin:0}.top{height:auto;padding:12px 18px;font-size:12px}.top .account{display:none}.wrap{padding:20px 16px 50px}.heading{align-items:flex-start}h1{font-size:23px}.heading button{font-size:12px;padding:8px 10px}.grid,.split{grid-template-columns:1fr}.summary{position:static}.stats{grid-template-columns:1fr 1fr}.stat{padding:12px 16px}.stat strong{font-size:22px}.fields{grid-template-columns:1fr}.toolbar input{max-width:100%}.tablewrap table{min-width:640px}.mobile-list table{min-width:0}.mobile-list thead{display:none}.mobile-list tbody{display:grid}.mobile-list tr{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding:12px 16px}.mobile-list td{padding:5px 0;border:0}.mobile-list td:first-child{grid-column:1/-1}.mobile-list td.right{text-align:left}.mobile-list td:before{content:attr(data-label);display:block;color:var(--muted);font-size:11px}.pad{padding:18px}.pills button{font-size:13px;padding:8px 11px}.foot{gap:10px;flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<body><aside class="side"><div class="brand">BEST<span>CHOICE</span><div class="eyebrow">SALES WORKSPACE</div></div><div class="work"><small>หมวดงาน</small><strong>งานหน้าร้าน · SHOP</strong><small>สาขาตัวอย่าง</small></div><div><div class="eyebrow" style="padding:0 12px 10px">ขาย</div><nav id="nav"></nav></div><div class="sidebar-note small" style="margin-top:auto">แบบเสนอ UX/UI · 11 ก.ย. 2569<br>ข้อมูลทั้งหมดเป็นตัวอย่าง<br><a href="audit.md">อ่านรายงานตรวจโค้ด</a><br><a href="scrutinize.md">อ่านผลตรวจซ้ำ scrutinize</a></div></aside><main><header class="top"><span>งานหน้าร้าน <span style="margin:0 9px">/</span> ขาย</span><span class="demo">แนวคิดระยะถัดไป · ไม่มีการบันทึกจริง</span><span class="account">เจ้าของร้าน · สาขาตัวอย่าง</span></header><div class="wrap" id="app"></div></main><dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="dialog-actions"><button onclick="this.closest('dialog').close()">ปิด</button><button class="primary" id="dialog-next">ดูขั้นตอนถัดไป</button></div></dialog>
<script>
const pages=[['sale','ขายสินค้า'],['bookings','การจอง / มัดจำ'],['customers','ลูกค้า'],['credit','ตรวจเครดิต'],['contracts','สัญญาผ่อนชำระ'],['sales','รายการขาย']];
let current='sale',saleType='cash',customerTab='ภาพรวม';
const $=s=>document.querySelector(s), money=n=>n.toLocaleString('th-TH');
const btn=(label,action,cls='')=>`<button class="${cls}" onclick="${action}">${label}</button>`;
const badge=(text,tone='')=>`<span class="badge ${tone}">${text}</span>`;
const stats=items=>`<div class="stats">${items.map(([label,n,note])=>`<div class="stat"><span>${label}</span><strong>${n}</strong><span>${note||'ข้อมูลตัวอย่าง'}</span></div>`).join('')}</div>`;
const head=(title,sub,action='')=>`<div class="heading"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`;
const person=(name='ลูกค้าตัวอย่าง ก',sub='08x-xxx-0101')=>`<div class="person"><div class="avatar">ก</div><div><strong>${name}</strong><small>${sub}</small></div></div>`;
const table=(heads,rows)=>`<div class="tablewrap mobile-list"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((cell,i)=>`<td data-label="${i?heads[i]:''}">${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function showDialog(title,body,next){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog-next').hidden=!next;$('#dialog-next').onclick=()=>{$('#dialog').close();show(next)};$('#dialog').showModal()}
function toolbar(placeholder,items=[]){return `<div class="toolbar"><input aria-label="ค้นหารายการ" placeholder="${placeholder}" oninput="filterRows(this.value)">${items.map(t=>btn(t,`showDialog('${t}','<p>ตัวกรองนี้ใช้ช่วงข้อมูลเดียวกันทั้งรายการ ยอดสรุป และการส่งออก</p>')`)).join('')}</div>`}
function filterRows(q){document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q.toLowerCase()))}
function sale(){const installment=saleType==='installment',external=saleType==='external';return head('ขายสินค้า','เลือกวิธีขาย แล้วทำรายการต่อโดยใช้ลูกค้าและสินค้าเดิม',btn('เปิดใบจอง',"show('bookings')"))+`<div class="steps">${['ลูกค้าและสินค้า','ราคาและการชำระ','ตรวจทานและยืนยัน'].map((x,i)=>`<span class="step ${i<2?'on':''}"><b>${i+1}</b>${x}</span>${i<2?'<span class="divider"></span>':''}`).join('')}</div><div class="grid"><div class="stack"><section class="card pad"><div class="sectionhead row"><h2>วิธีขาย</h2><span class="small">เปลี่ยนได้โดยไม่ต้องเริ่มใหม่</span></div><div class="pills">${[['cash','เงินสด / โอน'],['installment','ผ่อน BESTCHOICE'],['external','ไฟแนนซ์ภายนอก']].map(([v,l])=>btn(l,`saleType='${v}';render()`,v===saleType?'selected':'')).join('')}</div></section><section class="card pad"><div class="sectionhead row"><h2>ลูกค้า</h2>${btn('เปลี่ยนลูกค้า',"show('customers')",'quiet')}</div>${person()}<div style="margin-top:14px">${installment?'<div class="hint">✓ อนุมัติค่างวดไม่เกิน 3,000 บาท/เดือน · ชำระทุกสิ้นเดือน</div>':'<div class="small">ข้อมูลหลักครบสำหรับรายการนี้</div>'}</div></section><section class="card pad"><div class="sectionhead row"><h2>สินค้าและราคา</h2>${badge('พร้อมขาย')}</div><div class="product"><div class="device" aria-hidden="true"></div><div style="flex:1"><h2>iPhone 15 · 128 GB</h2><div class="small">เครื่องใหม่ · สีดำ · สาขาตัวอย่าง</div><div class="small">IMEI ลงท้าย 2468 · รายการตัวอย่าง</div></div><div><div class="price">${installment?'20,000':'18,000'} ฿</div><div class="small">${installment?'ราคาผ่อน BESTCHOICE':external?'ราคาขายตามใบอนุมัติ':'ราคาเงินสด'}</div></div></div>${btn('+ เพิ่มของแถม',"showDialog('เลือกของแถม','<p>เลือกอุปกรณ์จากสต็อก ตรวจสาขาและจำนวนก่อนเพิ่มเข้ารายการ</p>')",'quiet')}<div class="hint">ใบจอง BK-6909-001 · รับมัดจำแล้ว 1,000 บาท ${btn('ดูใบจอง',"show('bookings')",'quiet')}</div></section><section class="card pad"><h2 class="sectionhead">${installment?'แผนผ่อนชำระ':external?'ข้อมูลไฟแนนซ์ภาย function show(id){current=id;location.hash=id;render();window.scrollTo(0,0)}
function render(){$('#nav').innerHTML=pages.map(([id,l],i)=>`<button class="${id===current?'active':''}" ${id===current?'aria-current="page"':''} onclick="show('${id}')"><span class="navicon">0${i+1}</span>${l}${id==='credit'?'<span class="count">2</span>':''}</button>`).join('');$('#app').innerHTML=({sale,bookings,customers,credit,contracts,sales})[current]();document.title='BESTCHOICE · '+pages.find(p=>p[0]===current)[1]+' · ต้นแบบ'}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(pages.some(p=>p[0]===id)&&id!==current){current=id;render()}});current=pages.some(p=>p[0]===location.hash.slice(1))?location.hash.slice(1):'sale';render();
</script></body></html>
